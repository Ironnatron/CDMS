{% extends "base.html" %}
{% block title %}{% if object %}Edit task{% else %}New task{% endif %} | Task manager{% endblock %}
{% block content %}
<section class="card form-card">
    <h1>{% if object %}Edit task{% else %}New task{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <div class="actions">
            <button class="button" type="submit">Save task</button>
            <a href="{% url 'tasks:list' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
