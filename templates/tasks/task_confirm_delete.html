{% extends "base.html" %}
{% block title %}Delete task | Task manager{% endblock %}
{% block content %}
<section class="card form-card">
    <h1>Delete task?</h1>
    <p>You're about to delete <strong>{{ object.title }}</strong>. This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button class="button danger" type="submit">Yes, delete task</button>
            <a href="{{ object.get_absolute_url }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
