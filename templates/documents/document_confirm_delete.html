{% extends "base.html" %}
{% block title %}Delete document | Task manager{% endblock %}
{% block content %}
{% include "documents/warning.html" %}
<section class="card form-card">
    <h1>Delete document?</h1>
    <p>Delete <strong>{{ object.title }}</strong> and its file? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button class="button danger" type="submit">Yes, delete document</button>
            <a href="{{ object.get_absolute_url }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
