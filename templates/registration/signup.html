{% extends "base.html" %}
{% block title %}Sign up | Task manager{% endblock %}
{% block content %}
<section class="card auth-card">
    <h1>Create an account</h1>
    <p class="muted">Keep track of your work in one place.</p>
    <form method="post">
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <button class="button" type="submit">Sign up</button>
    </form>
    <p>Already registered? <a href="{% url 'login' %}">Log in</a>.</p>
</section>
{% endblock %}
