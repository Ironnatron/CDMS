{% extends "base.html" %}
{% block title %}Log in | Task manager{% endblock %}
{% block content %}
<section class="card auth-card">
    <h1>Welcome back</h1>
    <p class="muted">Log in to manage your tasks.</p>
    <form method="post">
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button class="button" type="submit">Log in</button>
    </form>
    <p>New here? <a href="{% url 'signup' %}">Create an account</a>.</p>
</section>
{% endblock %}
