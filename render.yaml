services:
  - type: web
    name: django-task-manager
    runtime: python
    plan: starter
    region: oregon
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate --no-input
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile - --error-logfile -
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString

databases:
  - name: task-manager-db
    plan: basic-256mb
    region: oregon
    databaseName: taskmanager
    user: taskmanager
    ipAllowList: []
